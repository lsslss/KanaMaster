<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>Kana Master v1.0.0 (Official Stable)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        window.swRegistration = null;
        (function() {
            const absoluteUrl = window.location.origin + window.location.pathname;
            const manifest = {
                "name": "Kana Master",
                "short_name": "KanaMaster",
                "id": absoluteUrl + "?v1.0.0",
                "start_url": absoluteUrl,
                "display": "standalone",
                "background_color": "#0f172a",
                "theme_color": "#6366f1",
                "icons": [{
                    "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIHJ4PSI4MCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkeT0iLjM1ZW0iIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjMwMCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj7jgYI8L3RleHQ+PC9zdmc+",
                    "sizes": "512x512",
                    "type": "image/svg+xml",
                    "purpose": "any"
                }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest'; 
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    const isSupportedProtocol = ['http:', 'https:'].includes(location.protocol) || location.hostname === 'localhost';
                    if (isSupportedProtocol) {
                        navigator.serviceWorker.register('sw.js').then(reg => {
                            window.swRegistration = reg;
                            reg.onupdatefound = () => {
                                const worker = reg.installing;
                                if (!worker) return;
                                worker.onstatechange = () => {
                                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                        window.dispatchEvent(new CustomEvent('pwa_update_available'));
                                    }
                                };
                            };
                        });
                    }
                });
            }
        })();
    </script>

    <style>
        .perspective-1000 { perspective: 1000px; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .transform-style-3d { transform-style: preserve-3d; }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        ruby { display: ruby; ruby-align: center; }
        rt { 
            display: ruby-text; font-size: 0.5em; color: #6366f1; font-weight: 800; 
            line-height: 1.2; padding-bottom: 0.15em; text-align: center;
        }
        .large-font-mode rt { font-size: 0.65em; }

        .card-shadow { box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15), 0 5px 15px -5px rgba(0, 0, 0, 0.04); }
        :root { --safe-bottom: env(safe-area-inset-bottom, 20px); }
        body { background-color: #f8fafc; transition: background-color 0.5s ease; }
        @media (min-width: 768px) { body { background-color: #e2e8f0; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; } }
        
        .dark-mode .dark-mode-bg { background-color: #0f172a !important; }
        .dark-mode .dark-mode-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .dark-mode-text { color: #f1f5f9 !important; }
        .dark-mode .dark-mode-secondary { background-color: #334155 !important; }
        .dark-mode .dark-mode-border { border-color: #334155 !important; }
        .dark-mode .dark-mode-header { background-color: #1e293b !important; border-color: #0f172a !important; }

        /* 流體字體：全設備適應標準 */
        .fluid-word { font-size: clamp(3rem, 8vw + 0.5rem, 4.5rem); }
        .fluid-word-large { font-size: clamp(3.8rem, 10vw + 0.8rem, 6rem); }
        .fluid-sentence { font-size: clamp(1.6rem, 4vw + 0.4rem, 3rem); }
        .fluid-sentence-large { font-size: clamp(2rem, 6vw + 0.6rem, 4rem); }
    </style>
</head>
<body class="select-none overflow-hidden text-slate-800 font-sans h-screen">
    <div id="root" class="h-full flex justify-center items-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const APP_VERSION = "v1.0.0-Stable";

        const MANUAL_LESSON = [
            { unit: "正式版", category: "sentence", primary: "祝[いわ]い！發[はつ]行[こう]", reading: "いわいはつこう", meaning: "Kana Master v1.0.0 正式版發佈", secondary: "新[あたら]しい始[はじ]まり", secondaryreading: "あたらしいはじまり", emoji: "🎉", notes: "這是第一個具備流體字體與 MP3 語音管理系統的穩定版本。" },
            { unit: "功能", category: "sentence", primary: "全[ぜん]機[き]種[しゅ]對[たい]應[おう]", reading: "ぜんきしゅたいおう", meaning: "支援 PC、折疊機與各類手機", secondary: "レスポンシブ表示[ひょうじ]", secondaryreading: "れすぽんしぶひょうじ", emoji: "📱", notes: "不論系統字體大小，卡片都會自動調整至最舒適的觀看比例。" }
        ];

        // --- IndexedDB ---
        const DB_NAME = "KM_Audio_Core_v1"; 
        const STORE_NAME = "local_audio";
        const initDB = () => new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
            request.onsuccess = (e) => resolve(e.target.result);
        });
        const deleteStore = async () => { const db = await initDB(); const tx = db.transaction(STORE_NAME, "readwrite"); tx.objectStore(STORE_NAME).clear(); return new Promise(r => tx.oncomplete = r); };
        const getLocal = async (key) => { const db = await initDB(); return new Promise((r) => { const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).get(key); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); };
        const saveLocal = async (key, val) => { const db = await initDB(); db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(val, key); };
        
        const getStorageStats = async () => {
            const db = await initDB();
            return new Promise(r => {
                const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();
                req.onsuccess = () => {
                    const count = req.result.length;
                    let size = 0;
                    req.result.forEach(base64 => size += (base64.length * 0.75));
                    r({ count, size: (size / 1024 / 1024).toFixed(2) });
                };
            });
        };

        const RubyText = ({ text, className = "" }) => {
            if (!text) return null;
            const parts = text.split(/([^\[\]]\[[^\]]+\])/g);
            return <span className={className}>{parts.filter(Boolean).map((p, i) => {
                const m = p.match(/^([^\[])\[([^\]]+)\]$/);
                return m ? <ruby key={i}>{m[1]}<rt>{m[2]}</rt></ruby> : <span key={i}>{p}</span>;
            })}</span>;
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name, className]);
            return <span key={name} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        function App() {
            const [view, setView] = useState('practice');
            const [cards, setCards] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [ttsStatus, setTtsStatus] = useState('Standby');
            const [storageStats, setStorageStats] = useState({ count: 0, size: "0.00" });
            const [isCheckingUpdate, setIsCheckingUpdate] = useState(false);
            const [showUpdateToast, setShowUpdateToast] = useState(false);
            
            const [isAutoplay, setIsAutoplay] = useState(false);
            const [autoPlayTempo, setAutoPlayTempo] = useState(() => JSON.parse(localStorage.getItem('km_tempo_v10') ?? "5.0"));
            const autoplayTimerRef = useRef(null);

            const [openSections, setOpenSections] = useState({ pref: false, sync: false, voice: false });
            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('km_gas_v10') || '');
            const [isLargeFont, setIsLargeFont] = useState(() => JSON.parse(localStorage.getItem('km_font_v10') ?? 'false'));
            const [selectedUnits, setSelectedUnits] = useState(() => JSON.parse(localStorage.getItem('km_units_v10') || '[]'));
            const [practiceMode, setPracticeMode] = useState(() => localStorage.getItem('km_mode_v10') || 'order');
            const [autoSpeak, setAutoSpeak] = useState(() => JSON.parse(localStorage.getItem('km_autospeak_v10') ?? 'true'));
            const [speechRate, setSpeechRate] = useState(() => JSON.parse(localStorage.getItem('km_rate_v10') ?? "1.0"));
            const [cloudCourses, setCloudCourses] = useState(() => JSON.parse(localStorage.getItem('km_courses_v10') || '{}'));
            const [activeCourseId, setActiveCourseId] = useState(() => localStorage.getItem('km_active_v10') || 'builtin');
            const [useVibration, setUseVibration] = useState(() => JSON.parse(localStorage.getItem('km_vibrate_v10') ?? 'true'));
            const [themePreference, setThemePreference] = useState(() => localStorage.getItem('km_theme_v10') || 'system');
            
            const [wifiOnly, setWifiOnly] = useState(() => JSON.parse(localStorage.getItem('km_wifi_v10') ?? 'true'));
            const [isBgSyncing, setIsBgSyncing] = useState(false);

            const vibrate = (ms = 15) => { if (useVibration && navigator.vibrate) navigator.vibrate(ms); };
            const toggleSection = (key) => { vibrate(5); setOpenSections(prev => ({ ...prev, [key]: !prev[key] })); };
            const audioCache = useRef({}); 
            const fetchingRef = useRef(new Set());

            const refreshStats = useCallback(() => getStorageStats().then(setStorageStats), []);
            useEffect(() => { refreshStats(); }, [refreshStats]);

            useEffect(() => {
                const handler = () => setShowUpdateToast(true);
                window.addEventListener('pwa_update_available', handler);
                return () => window.removeEventListener('pwa_update_available', handler);
            }, []);

            useEffect(() => {
                const isDark = themePreference === 'dark' || (themePreference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark-mode');
                else document.documentElement.classList.remove('dark-mode');
            }, [themePreference]);

            const currentLessonItems = useMemo(() => {
                const raw = (activeCourseId === 'builtin' || !cloudCourses[activeCourseId]) ? MANUAL_LESSON : cloudCourses[activeCourseId];
                return raw.map(i => {
                    const n = { ...i };
                    Object.keys(i).forEach(k => n[k.toLowerCase().trim()] = i[k]);
                    return n;
                });
            }, [activeCourseId, cloudCourses]);

            const availableUnits = useMemo(() => [...new Set(currentLessonItems.map(i => i.unit))].filter(Boolean), [currentLessonItems]);

            const generatePracticeSet = useCallback((targetMode = practiceMode, silent = false) => {
                if (!silent) vibrate(10);
                const pool = currentLessonItems.filter(i => selectedUnits.includes(i.unit));
                if (pool.length === 0) { setCards([]); return; }
                const practiceCards = (targetMode === 'random') ? [...pool].sort(() => Math.random() - 0.5) : pool;
                setCards(practiceCards); setCurrentIndex(0); setIsFlipped(false); setView('practice'); 
            }, [selectedUnits, practiceMode, currentLessonItems]);

            useEffect(() => {
                if (cards.length === 0 && selectedUnits.length > 0 && availableUnits.length > 0) generatePracticeSet(practiceMode, true);
                if (selectedUnits.length === 0 && availableUnits.length > 0) setSelectedUnits([availableUnits[0]]);
            }, [availableUnits, cards.length, selectedUnits.length, generatePracticeSet, practiceMode]);

            const fetchVoice = async (primary, secondary) => {
                if (!primary) return null;
                const text = (secondary && secondary.toString().trim() !== "") ? `${primary}。 ${secondary}` : primary;
                if (audioCache.current[text]) return audioCache.current[text];
                if (fetchingRef.current.has(text)) return null;
                try {
                    fetchingRef.current.add(text);
                    const localBase64 = await getLocal(text);
                    if (localBase64) {
                        const audio = new Audio("data:audio/mpeg;base64," + localBase64);
                        audioCache.current[text] = audio; return audio;
                    }
                    if (!gasUrl) return null;
                    const response = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=tts&text=${encodeURIComponent(text)}`);
                    const result = await response.json();
                    if (result.data) {
                        await saveLocal(text, result.data); refreshStats();
                        const audio = new Audio("data:audio/mpeg;base64," + result.data);
                        audioCache.current[text] = audio; return audio;
                    }
                } catch (err) { setTtsStatus('FALLBACK'); return null; }
                finally { fetchingRef.current.delete(text); }
            };

            const speak = useCallback(async (card) => {
                if (!card?.reading) return;
                const audio = await fetchVoice(card.reading, card.secondaryreading);
                if (audio) {
                    audio.currentTime = 0; audio.playbackRate = parseFloat(speechRate);
                    setTtsStatus('PLAYING');
                    return new Promise(resolve => {
                        audio.onended = () => { setTtsStatus('DONE'); resolve(); };
                        audio.play().catch(resolve);
                    });
                } else {
                    return new Promise(resolve => {
                        window.speechSynthesis.cancel();
                        const main = new SpeechSynthesisUtterance(card.reading);
                        main.lang = 'ja-JP'; main.rate = parseFloat(speechRate);
                        if (card.secondaryreading) main.onend = () => { 
                            const sec = new SpeechSynthesisUtterance(card.secondaryreading);
                            sec.lang = 'ja-JP'; sec.rate = parseFloat(speechRate);
                            setTimeout(() => window.speechSynthesis.speak(sec), 400); 
                        }; else main.onend = resolve;
                        window.speechSynthesis.speak(main);
                    });
                }
            }, [gasUrl, speechRate, refreshStats]);

            useEffect(() => {
                if (view === 'practice' && cards.length > 0 && autoSpeak && !isAutoplay) speak(cards[currentIndex]);
            }, [currentIndex, view, autoSpeak, isAutoplay, cards, speak]);

            useEffect(() => {
                if (!isAutoplay || cards.length === 0 || view !== 'practice') return;
                const tempo = parseFloat(autoPlayTempo);
                const frontStay = tempo * 0.3 * 1000;
                const backStay = tempo * 0.7 * 1000;
                const runAutoCycle = async () => {
                    if (autoSpeak) await speak(cards[currentIndex]);
                    else await new Promise(r => setTimeout(r, 1200));
                    autoplayTimerRef.current = setTimeout(() => {
                        setIsFlipped(true); 
                        autoplayTimerRef.current = setTimeout(() => {
                            setIsFlipped(false); 
                            setCurrentIndex(prev => (prev + 1) % cards.length);
                        }, backStay);
                    }, frontStay);
                };
                runAutoCycle();
                return () => clearTimeout(autoplayTimerRef.current);
            }, [isAutoplay, currentIndex, cards, view, speak, autoSpeak, autoPlayTempo]);

            const getDynamicFontSize = useCallback((text) => {
                if (!text) return '';
                const baseText = text.replace(/\[[^\]]+\]/g, '');
                const len = baseText.length;
                if (len <= 5) return isLargeFont ? 'fluid-word-large' : 'fluid-word';
                return isLargeFont ? 'fluid-sentence-large' : 'fluid-sentence';
            }, [isLargeFont]);

            const performParallelDownload = async (items) => {
                if (!gasUrl || items.length === 0) return;
                const taskTexts = items.map(i => (i.secondaryreading && i.secondaryreading.trim() !== "") ? `${i.reading}。 ${i.secondaryreading}` : i.reading);
                const CONCURRENCY_LIMIT = 5;
                let taskPointer = 0;
                setIsBgSyncing(true);
                const worker = async () => {
                    while (taskPointer < taskTexts.length) {
                        const text = taskTexts[taskPointer++];
                        try {
                            const cached = await getLocal(text);
                            if (!cached) {
                                const res = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=tts&text=${encodeURIComponent(text)}`);
                                const result = await res.json();
                                if (result.data) await saveLocal(text, result.data);
                            }
                        } catch (e) {}
                    }
                };
                await Promise.all(Array(Math.min(CONCURRENCY_LIMIT, taskTexts.length)).fill(null).map(() => worker()));
                setIsBgSyncing(false);
                refreshStats();
            };

            useEffect(() => {
                if (view === 'practice' && cards.length > 0) {
                    if (wifiOnly && navigator.connection) {
                        const { type, saveData } = navigator.connection;
                        if (saveData) return;
                        if (type && type !== 'wifi' && type !== 'ethernet') return;
                    }
                    performParallelDownload(cards);
                }
            }, [cards, view, gasUrl, wifiOnly]);

            const checkUpdateManually = async () => {
                if (!window.swRegistration) return;
                setIsCheckingUpdate(true); vibrate(10);
                try { 
                    await window.swRegistration.update(); 
                    setTimeout(() => { setIsCheckingUpdate(false); if (!showUpdateToast) alert('目前已是最新版本 ' + APP_VERSION); }, 1200); 
                } catch (e) { setIsCheckingUpdate(false); }
            };

            const factoryReset = async () => { if (confirm('⚠️ 警告：這將清除所有緩存資料與設定。確定嗎？')) { vibrate(100); localStorage.clear(); await deleteStore(); window.location.reload(); } };

            useEffect(() => {
                localStorage.setItem('km_gas_v10', gasUrl);
                localStorage.setItem('km_font_v10', JSON.stringify(isLargeFont));
                localStorage.setItem('km_units_v10', JSON.stringify(selectedUnits));
                localStorage.setItem('km_mode_v10', practiceMode);
                localStorage.setItem('km_autospeak_v10', JSON.stringify(autoSpeak));
                localStorage.setItem('km_rate_v10', JSON.stringify(speechRate));
                localStorage.setItem('km_courses_v10', JSON.stringify(cloudCourses));
                localStorage.setItem('km_active_v10', activeCourseId);
                localStorage.setItem('km_vibrate_v10', JSON.stringify(useVibration));
                localStorage.setItem('km_theme_v10', themePreference);
                localStorage.setItem('km_tempo_v10', JSON.stringify(autoPlayTempo));
                localStorage.setItem('km_wifi_v10', JSON.stringify(wifiOnly));
            }, [gasUrl, isLargeFont, selectedUnits, practiceMode, autoSpeak, speechRate, cloudCourses, activeCourseId, useVibration, themePreference, autoPlayTempo, wifiOnly]);

            const currentCard = useMemo(() => cards[currentIndex] || {}, [cards, currentIndex]);
            const themePrimary = practiceMode === 'random' ? 'amber' : 'indigo';

            return (
                <div className={`w-full max-w-md h-full bg-slate-50 dark-mode-bg flex flex-col overflow-hidden relative md:shadow-2xl md:border-x border-slate-200 ${isLargeFont ? 'large-font-mode' : ''}`}>
                    {showUpdateToast && (
                        <div className="absolute top-0 left-0 right-0 z-50 p-3 bg-slate-900 text-white flex items-center justify-between animate-slide-down shadow-xl">
                            <div className="flex items-center gap-3 ml-2"><Icon name="sparkles" size={18} className="text-amber-400" /><span className="text-xs font-bold tracking-wide">版本更新已就緒！</span></div>
                            <button onClick={() => { vibrate(30); window.location.reload(true); }} className="bg-indigo-600 px-4 py-1.5 rounded-full text-xs font-black shadow-lg text-[10px]">立即重載</button>
                        </div>
                    )}

                    <header className="bg-white dark-mode-header border-b px-3 py-2 sticky top-0 z-30 flex justify-between items-center shrink-0 shadow-sm h-14 text-left">
                        <div className="flex flex-col text-left">
                            <div className="flex items-center gap-1.5 text-left">
                                <h1 className={`text-sm md:text-base font-black text-${themePrimary}-600 leading-none uppercase tracking-tighter text-left`}>Kana Master</h1>
                                <span className="text-[8px] font-black bg-indigo-50 dark-mode-secondary text-indigo-400 px-1.5 py-0.5 rounded leading-tight tracking-tighter uppercase">{APP_VERSION}</span>
                                {isBgSyncing && <Icon name="refresh-ccw" size={10} className="text-indigo-400 animate-spin ml-0.5" />}
                            </div>
                            <span className="text-[10px] text-slate-400 font-black uppercase mt-0.5 truncate max-w-[80px] text-left">{activeCourseId === 'builtin' ? 'Official Guide' : activeCourseId}</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <div className="flex bg-slate-100 dark-mode-secondary p-1 rounded-xl gap-0.5 mr-0.5 shadow-inner">
                                <button onClick={() => { setPracticeMode('order'); generatePracticeSet('order'); }} className={`p-1.5 rounded-lg transition-all ${practiceMode === 'order' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}><Icon name="list-ordered" size={16} /></button>
                                <button onClick={() => { setPracticeMode('random'); generatePracticeSet('random'); }} className={`p-1.5 rounded-lg transition-all ${practiceMode === 'random' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-400'}`}><Icon name="shuffle" size={16} /></button>
                            </div>
                            <button onClick={() => { vibrate(15); setIsAutoplay(!isAutoplay); }} className={`p-2 rounded-xl transition-all ${isAutoplay ? 'bg-rose-500 text-white shadow-md animate-pulse' : 'bg-slate-100 dark-mode-secondary text-slate-400'}`}>
                                <Icon name={isAutoplay ? "pause" : "play"} size={18} />
                            </button>
                            <button onClick={() => { vibrate(10); setAutoSpeak(!autoSpeak); }} className={`p-2 rounded-xl ${autoSpeak ? `bg-${themePrimary}-600 text-white shadow-md` : 'bg-slate-100 dark-mode-secondary text-slate-400'}`}><Icon name={autoSpeak ? "volume-2" : "volume-x"} size={18} /></button>
                            <button onClick={() => { vibrate(10); if(view === 'settings') generatePracticeSet(); else setView('settings'); }} className={`p-2 rounded-xl ${view === 'settings' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400'}`}><Icon name="settings" size={18} /></button>
                        </div>
                    </header>

                    <main className="flex-1 min-h-0 relative flex flex-col bg-slate-50 dark-mode-bg text-left">
                        {view === 'practice' && (
                            <div className="h-full flex flex-col overflow-hidden text-left relative">
                                <div className="shrink-0 p-4 pt-2 text-left">
                                    <div className="w-full flex items-center gap-3 px-1 max-w-sm mx-auto">
                                        <span className="text-[10px] font-black text-slate-400 dark-mode-text uppercase tracking-wider shrink-0">{currentCard.unit}</span>
                                        <div className="flex-1 bg-slate-200 dark-mode-secondary h-1 rounded-full overflow-hidden shadow-inner relative">
                                            <div className={`bg-${themePrimary}-500 h-full transition-all duration-300`} style={{ width: `${((currentIndex + 1) / (cards.length || 1)) * 100}%` }}></div>
                                        </div>
                                        <span className="text-[10px] font-black text-slate-400 dark-mode-text uppercase tracking-wider shrink-0">{currentIndex + 1} / {cards.length}</span>
                                    </div>
                                </div>

                                <div className="flex-1 flex items-center justify-center p-4 min-h-0 text-left">
                                    {cards.length > 0 ? (
                                        <div className={`relative w-full max-w-sm h-full max-h-[720px] perspective-1000 cursor-pointer transform-style-3d transition-transform duration-500 ${isFlipped ? 'rotate-y-180' : ''}`} onClick={() => { vibrate(5); setIsFlipped(!isFlipped); }}>
                                            <div className={`absolute inset-0 bg-white dark-mode-card rounded-[3rem] card-shadow flex flex-col overflow-hidden backface-hidden border border-slate-100 ${isFlipped ? 'hidden' : 'flex'}`}>
                                                <div className="h-[28%] flex items-center justify-center bg-indigo-50/15 relative shrink-0">
                                                    <span className={`${isLargeFont ? 'text-9xl' : 'text-8xl'} animate-bounce-slow text-left`}>{currentCard.emoji}</span>
                                                    <button onClick={(e) => { vibrate(20); e.stopPropagation(); speak(currentCard); }} className="absolute top-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg active:scale-90"><Icon name="volume-2" size={24}/></button>
                                                </div>
                                                <div className="flex-1 flex flex-col items-center justify-around py-8 px-6 text-center text-left">
                                                    <div className="flex-1 flex items-center justify-center w-full text-left">
                                                        <RubyText text={currentCard.primary} className={`${getDynamicFontSize(currentCard.primary)} font-black text-slate-800 dark-mode-text transition-all break-words leading-none text-left`} />
                                                    </div>
                                                    {currentCard.secondary && (
                                                        <div className="bg-indigo-50/50 dark-mode-secondary px-8 py-5 rounded-[2.5rem] border border-indigo-100/30 w-full flex items-center justify-center min-h-[4.5rem] text-left">
                                                            <RubyText text={currentCard.secondary} className={`${isLargeFont ? 'text-3xl' : 'text-2xl'} text-indigo-600 font-bold italic leading-tight text-left`} />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className={`absolute inset-0 bg-white dark-mode-card rounded-[3rem] card-shadow flex flex-col overflow-hidden backface-hidden rotate-y-180 border border-indigo-100 ${isFlipped ? 'flex' : 'hidden'}`}>
                                                <div className="h-14 flex items-center justify-between px-8 bg-slate-50 dark-mode-secondary border-b shrink-0 text-left">
                                                    <div className="flex items-center gap-3 text-left"><span className="text-xl">{currentCard.emoji}</span><RubyText text={currentCard.primary} className="text-sm font-black text-slate-400 text-left" /></div>
                                                    <button onClick={(e) => { vibrate(20); e.stopPropagation(); speak(currentCard); }} className="text-indigo-600 p-2 active:scale-90"><Icon name="volume-2" size={20}/></button>
                                                </div>
                                                <div className="flex-1 flex flex-col p-8 text-center justify-around overflow-hidden text-left">
                                                    <div className="space-y-1 text-left text-left">
                                                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em] text-left">Meaning</p>
                                                        <h3 className={`${isLargeFont ? 'text-4xl' : 'text-3xl'} font-black text-indigo-600 leading-tight text-left`}>{currentCard.meaning}</h3>
                                                    </div>
                                                    <div className="space-y-4 text-left">
                                                        {currentCard.secondary && <div className="bg-indigo-50/40 dark-mode-secondary p-5 rounded-[2rem] w-full flex items-center justify-center min-h-[6rem] text-left"><RubyText text={currentCard.secondary} className={`${isLargeFont ? 'text-3xl' : 'text-2xl'} text-slate-700 dark-mode-text font-bold leading-snug text-left`} /></div>}
                                                        <div className="w-full text-left space-y-2.5 text-left">
                                                            {currentCard.notes && <div className={`${isLargeFont ? 'text-sm' : 'text-xs'} bg-slate-50 dark-mode-secondary p-4 rounded-2xl border border-slate-100 dark-mode-card text-slate-500 font-bold leading-relaxed text-left`}>{currentCard.notes}</div>}
                                                            <div className="bg-rose-50/30 p-2.5 rounded-2xl border border-rose-100/20 flex justify-between items-center text-left">
                                                                <div className="flex flex-col text-left">
                                                                    <p className="text-[8px] font-black text-rose-400 uppercase tracking-wider text-left">Stable Engine v1</p>
                                                                    <p className="text-[10px] font-mono text-rose-500/50 truncate tracking-tight text-left">{currentCard.reading}</p>
                                                                </div>
                                                                <span className="bg-emerald-500 text-white px-2 py-0.5 rounded-full font-black text-[9px] uppercase shadow-sm">{ttsStatus}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center p-10 text-slate-300 font-bold space-y-4 text-center text-left"><Icon name="search-x" size={64} /><p className="text-lg">尚未選擇單元</p><button onClick={() => setView('settings')} className="bg-slate-200 text-slate-500 px-10 py-4 rounded-full text-sm font-black uppercase tracking-widest text-left">前往設定</button></div>
                                    )}
                                </div>

                                <div className="shrink-0 p-4 pb-[calc(var(--safe-bottom)+0.5rem)] text-left">
                                    <div className="grid grid-cols-2 gap-4 max-w-sm mx-auto text-left">
                                        <button onClick={() => { if(currentIndex>0) { setIsFlipped(false); setCurrentIndex(p=>p-1); } }} disabled={currentIndex === 0} className="bg-white dark-mode-card dark-mode-text dark-mode-border border-2 py-4 rounded-[1.5rem] font-black text-slate-400 disabled:opacity-30 active:scale-95 transition-all text-sm uppercase tracking-widest text-left text-center">PREV</button>
                                        <button onClick={() => { if(currentIndex < cards.length-1) { setIsFlipped(false); setCurrentIndex(p=>p+1); } else generatePracticeSet(); }} className={`bg-${themePrimary}-600 text-white py-4 rounded-[1.5rem] font-black shadow-lg active:scale-95 transition-all text-sm uppercase tracking-widest text-left text-center`}>NEXT</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="h-full flex flex-col overflow-hidden text-left">
                                <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 animate-in slide-in-from-bottom-4 duration-500 pb-40 text-left">
                                    <section className="bg-white dark-mode-card p-5 rounded-[2.5rem] shadow-lg space-y-4 text-left">
                                        <div className="flex justify-between items-center text-left"><h2 className="text-sm md:text-base font-black text-slate-700 dark-mode-text uppercase tracking-widest flex items-center gap-2 text-left"><Icon name="check-circle" size={18} className="text-indigo-600" /> 學習範圍</h2>
                                        <button onClick={checkUpdateManually} disabled={isCheckingUpdate} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-black uppercase transition-all ${isCheckingUpdate ? 'bg-slate-100 text-slate-400' : 'bg-indigo-50 dark-mode-secondary text-indigo-500'}`}><Icon name={isCheckingUpdate ? "loader-2" : "refresh-ccw"} size={10} className={isCheckingUpdate ? "animate-spin" : ""} />{isCheckingUpdate ? 'Checking' : APP_VERSION}</button></div>
                                        <div className="space-y-1.5 text-left"><label className="text-xs font-black text-slate-400 dark-mode-text uppercase ml-1 text-left">選擇課程</label><select value={activeCourseId} onChange={(e) => { vibrate(10); setActiveCourseId(e.target.value); setSelectedUnits([]); }} className="w-full p-3.5 bg-slate-50 dark-mode-secondary dark-mode-text rounded-xl text-sm font-bold border-none outline-none ring-1 ring-slate-100 focus:ring-indigo-500 text-left"><option value="builtin">💡 官方教學與手冊</option>{Object.keys(cloudCourses).map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                                        <div className="space-y-2 text-left"><label className="text-xs font-black text-slate-400 dark-mode-text uppercase ml-1 text-left">選擇單元 ({selectedUnits.length}/{availableUnits.length})</label><div className="grid grid-cols-2 gap-2.5 text-left">{availableUnits.map(u => (<button key={u} onClick={() => { vibrate(5); setSelectedUnits(prev => prev.includes(u) ? prev.filter(x => x !== u) : [...prev, u]); }} className={`py-3 px-2 rounded-xl text-[10px] font-black border transition-all ${selectedUnits.includes(u) ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark-mode-card dark-mode-text dark-mode-border border-slate-100'} text-left text-center`}>{u}</button>))}</div></div>
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left">
                                        <button onClick={() => toggleSection('pref')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left"><div className="text-left text-left text-left"><h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2 text-left"><Icon name="sliders" size={18} className="text-amber-500" /> 偏好設定</h3><p className="text-[9px] text-slate-400 font-bold mt-1 uppercase tracking-tight text-left">{speechRate}x / {themePreference} / {autoPlayTempo}s / {isLargeFont?'大字':'標字'} / {useVibration?'震':'靜'}</p></div><Icon name={openSections.pref ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" /></button>
                                        {openSections.pref && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left">
                                                <div className="pt-2 space-y-6 text-left">
                                                    <div className="space-y-2 text-left"><div className="flex justify-between items-center text-left text-left"><span className="text-xs font-black text-slate-500 dark-mode-text uppercase text-left">發音速度: {speechRate}x</span></div><input type="range" min="0.5" max="1.5" step="0.1" value={speechRate} onChange={(e) => setSpeechRate(parseFloat(e.target.value))} className="w-full accent-indigo-600 h-1.5 bg-slate-100 dark-mode-secondary rounded-lg appearance-none cursor-pointer" /></div>
                                                    <div className="space-y-2 border-t border-slate-100 pt-4 text-left"><div className="flex justify-between items-center text-left text-left text-left"><span className="text-xs font-black text-slate-500 dark-mode-text uppercase text-left">自動巡迴節奏: {autoPlayTempo}s</span></div><input type="range" min="3" max="12" step="0.5" value={autoPlayTempo} onChange={(e) => setAutoPlayTempo(parseFloat(e.target.value))} className="w-full accent-rose-500 h-1.5 bg-slate-100 dark-mode-secondary rounded-lg appearance-none cursor-pointer" /></div>
                                                    <div className="space-y-1.5 border-t border-slate-100 pt-4 text-left text-left"><label className="text-xs font-black text-slate-400 dark-mode-text uppercase ml-1 text-left">外觀主題</label><div className="flex bg-slate-100 dark-mode-secondary p-1 rounded-xl gap-1.5 text-left">{['light', 'dark', 'system'].map(m => (<button key={m} onClick={() => { vibrate(5); setThemePreference(m); }} className={`flex-1 py-2.5 rounded-lg text-xs font-black transition-all ${themePreference === m ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'} text-left text-center`}>{m === 'light' ? '淺色' : m === 'dark' ? '深色' : '系統'}</button>))}</div></div>
                                                    <div className="border-t border-slate-100 dark-mode-border pt-4 space-y-4 text-left">
                                                        <label className="flex items-center justify-between cursor-pointer p-4 bg-indigo-50/50 dark-mode-secondary rounded-xl border border-indigo-100/50 transition-all active:scale-[0.98] text-left"><div className="flex flex-col text-left"><span className="text-sm font-bold text-indigo-700 dark-mode-text font-black text-left">大字版面模式</span><span className="text-[10px] text-indigo-400 uppercase font-black font-mono tracking-tighter text-left">STABLE FLUID UI</span></div><input type="checkbox" checked={isLargeFont} onChange={(e) => { vibrate(20); setIsLargeFont(e.target.checked); }} className="w-6 h-6 rounded-md accent-indigo-600" /></label>
                                                        <label className="flex items-center justify-between cursor-pointer p-4 bg-slate-50 dark-mode-secondary rounded-xl border border-slate-100/50 transition-all active:scale-[0.98] text-left"><div className="flex flex-col text-left"><span className="text-sm font-bold text-slate-600 dark-mode-text font-black text-left text-left">啟用觸感回饋</span><span className="text-[10px] text-slate-400 uppercase font-black font-mono tracking-tighter text-left text-left">HAPTIC ENABLED</span></div><input type="checkbox" checked={useVibration} onChange={(e) => { setUseVibration(e.target.checked); if(e.target.checked) vibrate(20); }} className="w-6 h-6 rounded-md accent-indigo-600" /></label>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left">
                                        <button onClick={() => toggleSection('sync')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left text-left"><div className="text-left text-left text-left text-left text-left text-left text-left text-left"><h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2 text-left text-left"><Icon name="refresh-cw" size={18} className="text-emerald-500" /> 雲端連線</h3><p className="text-[9px] text-slate-400 font-bold mt-1 tracking-tight text-left text-left">{gasUrl ? 'CONNECTED' : 'OFFLINE'}</p></div><Icon name={openSections.sync ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" /></button>
                                        {openSections.sync && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left text-left text-left">
                                                <div className="pt-2 space-y-4 text-left text-left">
                                                    <input type="text" placeholder="貼上正式版 GAS URL" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} className="w-full p-4 bg-slate-50 dark-mode-secondary dark-mode-text rounded-xl text-xs font-mono border-none outline-none ring-1 ring-slate-100 focus:ring-indigo-500 text-left" />
                                                    <button onClick={() => {
                                                        if (!gasUrl) return;
                                                        setIsSyncing(true);
                                                        fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=sync`)
                                                            .then(res => res.json())
                                                            .then(data => { setCloudCourses(data); alert('課程清單同步成功！'); })
                                                            .catch(() => alert('連線失敗，請檢查 URL'))
                                                            .finally(() => setIsSyncing(false));
                                                    }} disabled={!gasUrl || isSyncing} className={`w-full py-4 rounded-xl bg-slate-800 text-white font-black text-sm active:scale-95 transition-all shadow-lg ${isSyncing ? 'opacity-50' : ''} text-left text-center`}>從雲端同步課程清單</button>
                                                    <div className="pt-2 border-t border-slate-100 dark-mode-border text-left"><button onClick={factoryReset} className="text-rose-400 text-[10px] font-black uppercase flex items-center gap-1 hover:text-rose-600 transition-colors py-2 text-left"><Icon name="trash-2" size={14} /> 重設應用程式 (Factory Reset)</button></div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left text-left">
                                        <button onClick={() => toggleSection('voice')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">
                                            <div className="text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">
                                                <h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2 text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">
                                                    <Icon name="database" size={18} className="text-rose-500 text-left" /> 語音資源
                                                </h3>
                                                <p className="text-[9px] text-slate-400 font-bold mt-1 uppercase tracking-tight text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">
                                                    {storageStats.size} MB / {wifiOnly?'WiFi 僅限':'流量不限'}
                                                </p>
                                            </div>
                                            <Icon name={openSections.voice ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" />
                                        </button>
                                        {openSections.voice && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left text-left text-left text-left">
                                                <div className="pt-2 space-y-4 text-left text-left text-left">
                                                    <label className="flex items-center justify-between cursor-pointer p-4 bg-slate-50 dark-mode-secondary rounded-xl border border-slate-100 transition-all active:scale-[0.98] text-left text-left"><div className="flex flex-col text-left text-left"><span className="text-sm font-bold text-slate-600 dark-mode-text font-black text-left text-left">僅在 WiFi 下預取</span><span className="text-[10px] text-slate-400 uppercase font-black text-left text-left text-left">AUTO DOWNLOAD STRATEGY</span></div><input type="checkbox" checked={wifiOnly} onChange={(e) => setWifiOnly(e.target.checked)} className="w-6 h-6 rounded-md accent-indigo-600" /></label>
                                                    <div className="bg-indigo-50/50 dark-mode-secondary p-5 rounded-2xl flex gap-3 text-left text-left text-left">
                                                        <button onClick={() => { vibrate(30); performParallelDownload(currentLessonItems); }} className="flex-1 bg-indigo-600 text-white text-xs py-3.5 rounded-xl font-black shadow-sm active:scale-95 transition-all uppercase tracking-tighter text-left text-center">下載 MP3 離線包</button>
                                                        <button onClick={() => { if(confirm('確定要清空語音快取嗎？')){ vibrate(50); deleteStore(); refreshStats(); } }} className="bg-white border border-rose-200 text-rose-500 text-xs py-3.5 px-4 rounded-xl font-black active:scale-95 transition-all text-left text-center">清除</button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </section>
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 p-4 pb-[calc(var(--safe-bottom)+0.5rem)] bg-gradient-to-t from-slate-50 dark-mode-bg to-transparent z-20 text-left text-left text-left text-left text-left text-left">
                                    <button onClick={() => generatePracticeSet()} className="bg-slate-900 text-white w-full py-5 rounded-full font-black shadow-2xl flex items-center justify-center gap-3 active:scale-95 transition-all border-2 border-white/20 text-left text-center text-left text-center text-left"><Icon name="check-circle" size={20} /><span className="text-sm md:text-base font-black uppercase tracking-widest text-left text-center text-left text-center text-left">套用設定並開始</span></button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
