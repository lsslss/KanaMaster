<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>Kana Master v8.2-Lab (Visual Refined)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        window.swRegistration = null;
        (function() {
            const absoluteUrl = window.location.origin + window.location.pathname;
            const manifest = {
                "name": "Kana Master (Lab)",
                "short_name": "KM Lab",
                "id": absoluteUrl + "?dev_v8.2",
                "start_url": absoluteUrl,
                "display": "standalone",
                "background_color": "#0f172a",
                "theme_color": "#6366f1",
                "icons": [{
                    "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIHJ4PSI4MCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkeT0iLjM1ZW0iIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjMwMCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj7jgYI8L3RleHQ+PC9zdmc+",
                    "sizes": "512x512",
                    "type": "image/svg+xml",
                    "purpose": "any"
                }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest'; 
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    const isSupportedProtocol = ['http:', 'https:'].includes(location.protocol) || location.hostname === 'localhost';
                    if (isSupportedProtocol) {
                        navigator.serviceWorker.register('sw.js').then(reg => {
                            window.swRegistration = reg;
                            reg.onupdatefound = () => {
                                const installingWorker = reg.installing;
                                if (!installingWorker) return;
                                installingWorker.onstatechange = () => {
                                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        window.dispatchEvent(new CustomEvent('pwa_update_available'));
                                    }
                                };
                            };
                        });
                    }
                });
            }
        })();
    </script>

    <style>
        .perspective-1000 { perspective: 1000px; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .transform-style-3d { transform-style: preserve-3d; }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* --- 核心修正：Ruby 標準對齊 --- */
        ruby { display: ruby; ruby-align: center; }
        rt { 
            display: ruby-text; 
            font-size: 0.5em; 
            color: #6366f1; 
            font-weight: 800; 
            line-height: 1.2;
            padding-bottom: 0.15em;
            text-align: center;
        }
        
        .large-font-mode rt { font-size: 0.65em; }

        .card-shadow { box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15), 0 5px 15px -5px rgba(0, 0, 0, 0.04); }
        :root { --safe-bottom: env(safe-area-inset-bottom, 20px); }
        body { background-color: #f8fafc; transition: background-color 0.5s ease; }
        @media (min-width: 768px) { body { background-color: #e2e8f0; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; } }
        
        .dark-mode .dark-mode-bg { background-color: #0f172a !important; }
        .dark-mode .dark-mode-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .dark-mode-text { color: #f1f5f9 !important; }
        .dark-mode .dark-mode-secondary { background-color: #334155 !important; }
        .dark-mode .dark-mode-border { border-color: #334155 !important; }
        .dark-mode .dark-mode-header { background-color: #1e293b !important; border-color: #0f172a !important; }
    </style>
</head>
<body class="select-none overflow-hidden text-slate-800 font-sans h-screen">
    <div id="root" class="h-full flex justify-center items-center text-left"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const APP_VERSION = "v8.2-Lab";

        const MANUAL_LESSON = [
            { unit: "實驗室", category: "sentence", primary: "對[つい]齊[けい]修[しゅう]正[せい]", reading: "ついきょうしゅうせい", meaning: "v8.2 完美修復 Ruby 標註與漢字對齊問題", secondary: "一[いち]對[つい]一[いち]標[ひょう]記[き]", secondaryreading: "いちたいいちひょうき", emoji: "📏", notes: "已捨棄 Flex 佈局，回歸標準 Ruby 渲染。" },
            { unit: "實驗室", category: "sentence", primary: "字[じ]型[けい]縮[しゅく]放[ほう]", reading: "じけいしゅくほう", meaning: "根據字數自動調整大小，不再忽然跳大字", secondary: "階[かい]梯[てい]式[しき]縮[しゅく]放[ほう]", secondaryreading: "かいていしきしゅくほう", emoji: "🔍", notes: "短詞與長句現在都有最適合的視覺比例。" }
        ];

        // --- IndexedDB ---
        const DB_NAME = "KM_Lab_Audio_v1"; 
        const STORE_NAME = "local_audio";
        const initDB = () => new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
            request.onsuccess = (e) => resolve(e.target.result);
        });
        const deleteStore = async () => { const db = await initDB(); const tx = db.transaction(STORE_NAME, "readwrite"); tx.objectStore(STORE_NAME).clear(); return new Promise(r => tx.oncomplete = r); };
        const getLocal = async (key) => { const db = await initDB(); return new Promise((r) => { const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).get(key); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); };
        const saveLocal = async (key, val) => { const db = await initDB(); db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(val, key); };
        
        const getStorageStats = async () => {
            const db = await initDB();
            return new Promise(r => {
                const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();
                req.onsuccess = () => {
                    const count = req.result.length;
                    let size = 0;
                    req.result.forEach(base64 => {
                        // 估算 Base64 原始大小 (byte)
                        size += (base64.length * 0.75);
                    });
                    r({ count, size: (size / 1024 / 1024).toFixed(2) });
                };
            });
        };

        const RubyText = ({ text, className = "" }) => {
            if (!text) return null;
            // 修正 Regex 以支援一對一標記：漢[かん]字[じ]
            const parts = text.split(/([^[\]\s、。！？]+\[[^\]]+\])/g);
            return <span className={className}>{parts.map((p, i) => {
                const m = p.match(/^([^\[]+)\[([^\]]+)\]$/);
                // 使用原生 ruby 結構，不加額外的 flex container
                return m ? <ruby key={i}>{m[1]}<rt>{m[2]}</rt></ruby> : <span key={i}>{p}</span>;
            })}</span>;
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name, className]);
            return <span key={name} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        function App() {
            const [view, setView] = useState('practice');
            const [cards, setCards] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [ttsStatus, setTtsStatus] = useState('Standby');
            const [storageStats, setStorageStats] = useState({ count: 0, size: "0.00" });
            const [downloadProgress, setDownloadProgress] = useState(null);
            const [showUpdateToast, setShowUpdateToast] = useState(false);
            
            const [isAutoplay, setIsAutoplay] = useState(false);
            const [autoPlayTempo, setAutoPlayTempo] = useState(() => JSON.parse(localStorage.getItem('km_tempo_v82') ?? "5.0"));
            const autoplayTimerRef = useRef(null);
            const wakeLockRef = useRef(null);

            const [openSections, setOpenSections] = useState({ pref: false, sync: false, voice: false });
            
            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('km_lab_gas') || '');
            const [isLargeFont, setIsLargeFont] = useState(() => JSON.parse(localStorage.getItem('km_large_font_v53') ?? 'false'));
            const [selectedUnits, setSelectedUnits] = useState(() => JSON.parse(localStorage.getItem('km_lab_u') || '[]'));
            const [practiceMode, setPracticeMode] = useState(() => localStorage.getItem('km_mode_v43') || 'order');
            const [autoSpeak, setAutoSpeak] = useState(() => JSON.parse(localStorage.getItem('km_autospeak_v43') ?? 'false'));
            const [speechRate, setSpeechRate] = useState(() => JSON.parse(localStorage.getItem('km_speechrate_v43') ?? "1.0"));
            const [cloudCourses, setCloudCourses] = useState(() => JSON.parse(localStorage.getItem('km_lab_c') || '{}'));
            const [activeCourseId, setActiveCourseId] = useState(() => localStorage.getItem('km_lab_a') || 'builtin');
            const [useVibration, setUseVibration] = useState(() => JSON.parse(localStorage.getItem('km_vibrate_v61') ?? 'true'));
            const [themePreference, setThemePreference] = useState(() => localStorage.getItem('km_theme_v61') || 'system');
            const [autoDownload, setAutoDownload] = useState(() => JSON.parse(localStorage.getItem('km_auto_dl_v63') ?? 'true'));

            const vibrate = (ms = 15) => { if (useVibration && navigator.vibrate) navigator.vibrate(ms); };
            const toggleSection = (key) => { vibrate(5); setOpenSections(prev => ({ ...prev, [key]: !prev[key] })); };
            const audioCache = useRef({}); 
            const fetchingRef = useRef(new Set());

            const refreshStats = useCallback(() => getStorageStats().then(setStorageStats), []);
            useEffect(() => { refreshStats(); }, [refreshStats]);

            useEffect(() => {
                const handler = () => setShowUpdateToast(true);
                window.addEventListener('pwa_update_available', handler);
                return () => window.removeEventListener('pwa_update_available', handler);
            }, []);

            useEffect(() => {
                const applyTheme = () => {
                    const isDark = themePreference === 'dark' || (themePreference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    if (isDark) document.documentElement.classList.add('dark-mode');
                    else document.documentElement.classList.remove('dark-mode');
                };
                applyTheme();
            }, [themePreference]);

            useEffect(() => {
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator) {
                        try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } catch (err) {}
                    }
                };
                if (view === 'practice') requestWakeLock();
                else if (wakeLockRef.current) { wakeLockRef.current.release(); wakeLockRef.current = null; }
            }, [view]);

            const currentLessonItems = useMemo(() => {
                const raw = (activeCourseId === 'builtin' || !cloudCourses[activeCourseId]) ? MANUAL_LESSON : cloudCourses[activeCourseId];
                return raw.map(i => {
                    const n = { ...i };
                    Object.keys(i).forEach(k => n[k.toLowerCase().trim()] = i[k]);
                    return n;
                });
            }, [activeCourseId, cloudCourses]);

            const availableUnits = useMemo(() => [...new Set(currentLessonItems.map(i => i.unit))].filter(Boolean), [currentLessonItems]);

            const generatePracticeSet = useCallback((targetMode = practiceMode) => {
                vibrate(10);
                const pool = currentLessonItems.filter(i => selectedUnits.includes(i.unit));
                if (pool.length === 0) { setCards([]); return; }
                const practiceCards = (targetMode === 'random') ? [...pool].sort(() => Math.random() - 0.5) : pool;
                setCards(practiceCards); setCurrentIndex(0); setIsFlipped(false); setView('practice'); 
            }, [selectedUnits, practiceMode, currentLessonItems]);

            useEffect(() => {
                if (cards.length === 0 && selectedUnits.length > 0 && availableUnits.length > 0) generatePracticeSet();
            }, [availableUnits, cards.length, selectedUnits.length, generatePracticeSet]);

            const fetchVoice = async (primary, secondary) => {
                if (!primary) return null;
                const text = (secondary && secondary.toString().trim() !== "") ? `${primary}。 ${secondary}` : primary;
                if (audioCache.current[text]) return audioCache.current[text];
                if (fetchingRef.current.has(text)) return null;
                try {
                    fetchingRef.current.add(text);
                    const localBase64 = await getLocal(text);
                    if (localBase64) {
                        setTtsStatus('HIT: LAB DISK');
                        const audio = new Audio("data:audio/mpeg;base64," + localBase64);
                        audioCache.current[text] = audio; return audio;
                    }
                    if (!gasUrl) return null;
                    const response = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=tts&text=${encodeURIComponent(text)}`);
                    const result = await response.json();
                    if (result.data) {
                        setTtsStatus('HIT: LAB CLOUD');
                        await saveLocal(text, result.data); refreshStats();
                        const audio = new Audio("data:audio/mpeg;base64," + result.data);
                        audioCache.current[text] = audio; return audio;
                    }
                } catch (err) { setTtsStatus('FALLBACK'); return null; }
                finally { fetchingRef.current.delete(text); }
            };

            const speak = useCallback(async (card) => {
                if (!card?.reading) return;
                const audio = await fetchVoice(card.reading, card.secondaryreading);
                if (audio) {
                    audio.currentTime = 0; audio.playbackRate = parseFloat(speechRate);
                    return new Promise(resolve => {
                        audio.onended = resolve;
                        audio.play().catch(resolve);
                    });
                } else {
                    return new Promise(resolve => {
                        window.speechSynthesis.cancel();
                        const main = new SpeechSynthesisUtterance(card.reading);
                        main.lang = 'ja-JP'; main.rate = parseFloat(speechRate);
                        if (card.secondaryreading) main.onend = () => { 
                            const sec = new SpeechSynthesisUtterance(card.secondaryreading);
                            sec.lang = 'ja-JP'; sec.rate = parseFloat(speechRate);
                            setTimeout(() => window.speechSynthesis.speak(sec), 400); 
                        }; else main.onend = resolve;
                        window.speechSynthesis.speak(main);
                    });
                }
            }, [gasUrl, speechRate, refreshStats]);

            // --- 核心邏輯：自動播放重構 (v8.2) ---
            useEffect(() => {
                if (!isAutoplay || cards.length === 0 || view !== 'practice') return;
                
                const tempo = parseFloat(autoPlayTempo);
                const frontStay = tempo * 0.3 * 1000;
                const backStay = tempo * 0.7 * 1000;

                const runAutoCycle = async () => {
                    // 1. 如果有開聲音按鈕，才朗讀
                    if (autoSpeak) await speak(cards[currentIndex]);
                    
                    // 2. 正面停留
                    autoplayTimerRef.current = setTimeout(() => {
                        setIsFlipped(true); // 翻面
                        // 3. 背面停留
                        autoplayTimerRef.current = setTimeout(() => {
                            setIsFlipped(false); // 翻回來
                            setCurrentIndex(prev => (prev + 1) % cards.length); // 切換下一張
                        }, backStay);
                    }, frontStay);
                };

                runAutoCycle();
                return () => clearTimeout(autoplayTimerRef.current);
            }, [isAutoplay, currentIndex, cards, view, speak, autoSpeak, autoPlayTempo]);

            // --- 核心修正：動態字級計算 (v8.2) ---
            const getDynamicFontSize = useCallback((text) => {
                if (!text) return '';
                // 排除 Ruby 標註，只算基底字數
                const baseText = text.replace(/\[[^\]]+\]/g, '');
                const len = baseText.length;
                
                if (len <= 2) return isLargeFont ? 'text-[10rem]' : 'text-[8rem]';
                if (len <= 5) return isLargeFont ? 'text-[6rem]' : 'text-[5rem]';
                if (len <= 8) return isLargeFont ? 'text-[4.5rem]' : 'text-[3.5rem]';
                return isLargeFont ? 'text-[3.5rem]' : 'text-[2.5rem]';
            }, [isLargeFont]);

            const performParallelDownload = async (items, onProgress) => {
                if (!gasUrl) return;
                const taskTexts = items.map(i => (i.secondaryreading && i.secondaryreading.trim() !== "") ? `${i.reading}。 ${i.secondaryreading}` : i.reading);
                const CONCURRENCY_LIMIT = 8;
                let taskPointer = 0, done = 0;
                const worker = async () => {
                    while (taskPointer < taskTexts.length) {
                        const text = taskTexts[taskPointer++];
                        try {
                            if (!(await getLocal(text))) {
                                const res = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=tts&text=${encodeURIComponent(text)}`);
                                const result = await res.json();
                                if (result.data) await saveLocal(text, result.data);
                            }
                        } catch (e) {} finally { done++; onProgress(Math.round((done / taskTexts.length) * 100)); }
                    }
                };
                await Promise.all(Array(Math.min(CONCURRENCY_LIMIT, taskTexts.length)).fill(null).map(() => worker()));
                refreshStats();
            };

            const downloadAll = async () => {
                setDownloadProgress(0); vibrate(30);
                await performParallelDownload(currentLessonItems, setDownloadProgress);
                setTimeout(() => { setDownloadProgress(null); vibrate(50); }, 2000);
            };

            const clearCache = async () => { if (confirm('確定要清空 Lab 專屬 MP3 快取嗎？')) { vibrate(50); await deleteStore(); audioCache.current = {}; refreshStats(); } };
            const factoryReset = async () => { if (confirm('⚠️ 警告：重設所有測試資料？')) { vibrate(100); localStorage.clear(); await deleteStore(); window.location.reload(); } };

            useEffect(() => {
                localStorage.setItem('km_lab_gas', gasUrl);
                localStorage.setItem('km_large_font_v53', JSON.stringify(isLargeFont));
                localStorage.setItem('km_lab_u', JSON.stringify(selectedUnits));
                localStorage.setItem('km_mode_v43', practiceMode);
                localStorage.setItem('km_autospeak_v43', JSON.stringify(autoSpeak));
                localStorage.setItem('km_speechrate_v43', JSON.stringify(speechRate));
                localStorage.setItem('km_lab_c', JSON.stringify(cloudCourses));
                localStorage.setItem('km_lab_a', activeCourseId);
                localStorage.setItem('km_vibrate_v61', JSON.stringify(useVibration));
                localStorage.setItem('km_theme_v61', themePreference);
                localStorage.setItem('km_auto_dl_v63', JSON.stringify(autoDownload));
                localStorage.setItem('km_tempo_v82', JSON.stringify(autoPlayTempo));
            }, [gasUrl, isLargeFont, selectedUnits, practiceMode, autoSpeak, speechRate, cloudCourses, activeCourseId, useVibration, themePreference, autoDownload, autoPlayTempo]);

            const currentCard = useMemo(() => cards[currentIndex] || {}, [cards, currentIndex]);
            const themePrimary = practiceMode === 'random' ? 'amber' : 'indigo';

            const syncFromCloud = async () => {
                if (!gasUrl) return;
                setIsSyncing(true);
                try {
                    const res = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=sync`);
                    const data = await res.json();
                    setCloudCourses(data);
                    const ks = Object.keys(data);
                    if (ks.length > 0) { setActiveCourseId(ks[0]); setSelectedUnits([]); alert('Lab 環境同步成功！'); }
                } catch(e) { alert('同步失敗'); }
                finally { setIsSyncing(false); }
            };

            return (
                <div className={`w-full max-w-md h-full bg-slate-50 dark-mode-bg flex flex-col overflow-hidden relative md:shadow-2xl md:border-x border-slate-200 ${isLargeFont ? 'large-font-mode' : ''}`}>
                    {showUpdateToast && (
                        <div className="absolute top-0 left-0 right-0 z-50 p-3 bg-slate-900 text-white flex items-center justify-between animate-slide-down shadow-xl">
                            <div className="flex items-center gap-3 ml-2"><Icon name="sparkles" size={18} className="text-amber-400" /><span className="text-xs font-bold tracking-wide">實驗室新代碼就緒！</span></div>
                            <button onClick={() => { vibrate(30); window.location.reload(true); }} className="bg-indigo-600 px-4 py-1.5 rounded-full text-xs font-black shadow-lg text-[10px]">Reload</button>
                        </div>
                    )}

                    <header className="bg-white dark-mode-header border-b px-3 py-2 sticky top-0 z-30 flex justify-between items-center shrink-0 shadow-sm h-14">
                        <div className="flex flex-col text-left">
                            <div className="flex items-center gap-1.5 text-left">
                                <h1 className={`text-sm md:text-base font-black text-${themePrimary}-600 leading-none`}>KM Lab</h1>
                                <span className="text-[10px] font-black bg-indigo-50 dark-mode-secondary text-indigo-400 px-1.5 py-0.5 rounded leading-tight uppercase">{APP_VERSION}</span>
                            </div>
                            <span className="text-[11px] text-slate-400 font-black uppercase mt-0.5 truncate max-w-[80px] text-left">{activeCourseId === 'builtin' ? 'Dev Guide' : activeCourseId}</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <div className="flex bg-slate-100 dark-mode-secondary p-1 rounded-xl gap-0.5 mr-0.5">
                                <button onClick={() => { setPracticeMode('order'); generatePracticeSet('order'); }} className={`p-1.5 rounded-lg transition-all ${practiceMode === 'order' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}><Icon name="list-ordered" size={16} /></button>
                                <button onClick={() => { setPracticeMode('random'); generatePracticeSet('random'); }} className={`p-1.5 rounded-lg transition-all ${practiceMode === 'random' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-400'}`}><Icon name="shuffle" size={16} /></button>
                            </div>
                            <button onClick={() => { vibrate(15); setIsAutoplay(!isAutoplay); }} className={`p-2 rounded-xl transition-all ${isAutoplay ? 'bg-rose-500 text-white shadow-md animate-pulse' : 'bg-slate-100 dark-mode-secondary text-slate-400'}`}>
                                <Icon name={isAutoplay ? "pause" : "play"} size={18} />
                            </button>
                            <button onClick={() => { vibrate(10); setAutoSpeak(!autoSpeak); }} className={`p-2 rounded-xl ${autoSpeak ? `bg-${themePrimary}-600 text-white shadow-md` : 'bg-slate-100 dark-mode-secondary text-slate-400'}`}><Icon name={autoSpeak ? "volume-2" : "volume-x"} size={18} /></button>
                            <button onClick={() => { vibrate(10); if(view === 'settings') generatePracticeSet(); else setView('settings'); }} className={`p-2 rounded-xl ${view === 'settings' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400'}`}><Icon name="settings" size={18} /></button>
                        </div>
                    </header>

                    <main className="flex-1 min-h-0 relative flex flex-col bg-slate-50 dark-mode-bg">
                        {view === 'practice' && (
                            <div className="h-full flex flex-col overflow-hidden text-left relative">
                                <div className="shrink-0 p-4 pt-6 text-left">
                                    <div className="w-full flex items-center gap-3 px-1 max-w-sm mx-auto">
                                        <span className="text-xs font-black text-slate-400 dark-mode-text uppercase tracking-wider shrink-0">{currentCard.unit}</span>
                                        <div className="flex-1 bg-slate-200 dark-mode-secondary h-1.5 rounded-full overflow-hidden shadow-inner relative">
                                            <div className={`bg-${themePrimary}-500 h-full transition-all duration-300 shadow-[0_0_8px_rgba(79,70,229,0.3)]`} style={{ width: `${((currentIndex + 1) / (cards.length || 1)) * 100}%` }}></div>
                                        </div>
                                        <span className="text-xs font-black text-slate-400 dark-mode-text uppercase tracking-wider shrink-0">{currentIndex + 1} / {cards.length}</span>
                                    </div>
                                </div>

                                <div className="flex-1 flex items-center justify-center p-4 min-h-0">
                                    {cards.length > 0 ? (
                                        <div className={`relative w-full max-w-sm h-full max-h-[700px] perspective-1000 cursor-pointer transform-style-3d transition-transform duration-500 ${isFlipped ? 'rotate-y-180' : ''}`} onClick={() => { vibrate(5); setIsFlipped(!isFlipped); }}>
                                            <div className={`absolute inset-0 bg-white dark-mode-card rounded-[3rem] card-shadow flex flex-col overflow-hidden backface-hidden border border-slate-100 ${isFlipped ? 'hidden' : 'flex'}`}>
                                                <div className="h-[30%] flex items-center justify-center bg-indigo-50/15 relative shrink-0">
                                                    <span className={`${isLargeFont ? 'text-9xl' : 'text-8xl'} animate-bounce-slow`}>{currentCard.emoji}</span>
                                                    <button onClick={(e) => { vibrate(20); e.stopPropagation(); speak(currentCard); }} className="absolute top-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg active:scale-90"><Icon name="volume-2" size={24}/></button>
                                                </div>
                                                <div className="flex-1 flex flex-col items-center justify-around py-10 px-6 text-center">
                                                    <div className="flex-1 flex items-center justify-center w-full">
                                                        <RubyText text={currentCard.primary} className={`${getDynamicFontSize(currentCard.primary)} font-black text-slate-800 dark-mode-text transition-all break-words leading-none`} />
                                                    </div>
                                                    {currentCard.secondary && (
                                                        <div className="bg-indigo-50/50 dark-mode-secondary px-8 py-5 rounded-[2.5rem] border border-indigo-100/30 w-full flex items-center justify-center min-h-[5rem]">
                                                            <RubyText text={currentCard.secondary} className={`${isLargeFont ? 'text-3xl' : 'text-2xl'} text-indigo-600 font-bold italic leading-tight`} />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className={`absolute inset-0 bg-white dark-mode-card rounded-[3rem] card-shadow flex flex-col overflow-hidden backface-hidden rotate-y-180 border border-indigo-100 ${isFlipped ? 'flex' : 'hidden'}`}>
                                                <div className="h-16 flex items-center justify-between px-8 bg-slate-50 dark-mode-secondary border-b shrink-0">
                                                    <div className="flex items-center gap-3"><span className="text-2xl">{currentCard.emoji}</span><RubyText text={currentCard.primary} className="text-sm font-black text-slate-400" /></div>
                                                    <button onClick={(e) => { vibrate(20); e.stopPropagation(); speak(currentCard); }} className="text-indigo-600 p-2 active:scale-90"><Icon name="volume-2" size={24}/></button>
                                                </div>
                                                <div className="flex-1 flex flex-col p-8 text-center justify-around overflow-hidden text-left">
                                                    <div className="space-y-2 text-left">
                                                        <p className="text-xs font-black text-slate-300 uppercase tracking-[0.2em] text-left">Translation</p>
                                                        <h3 className={`${isLargeFont ? 'text-5xl' : 'text-4xl'} font-black text-indigo-600 leading-tight text-left`}>{currentCard.meaning}</h3>
                                                    </div>
                                                    
                                                    <div className="space-y-6">
                                                        {currentCard.secondary && <div className="bg-indigo-50/40 dark-mode-secondary p-6 rounded-[2.5rem] w-full flex items-center justify-center min-h-[7rem]"><RubyText text={currentCard.secondary} className={`${isLargeFont ? 'text-4xl' : 'text-3xl'} text-slate-700 dark-mode-text font-bold leading-snug`} /></div>}
                                                        
                                                        <div className="w-full text-left space-y-3">
                                                            {currentCard.notes && <div className={`${isLargeFont ? 'text-base' : 'text-sm'} bg-slate-50 dark-mode-secondary p-5 rounded-3xl border border-slate-100 dark-mode-card text-slate-500 font-bold leading-relaxed`}>{currentCard.notes}</div>}
                                                            <div className="bg-rose-50/30 p-3 rounded-2xl border border-rose-100/20 flex justify-between items-center">
                                                                <div className="flex flex-col text-left">
                                                                    <p className="text-[9px] font-black text-rose-400 uppercase tracking-wider text-left">LAB ENGINE (MP3)</p>
                                                                    <p className="text-xs font-mono text-rose-500/50 truncate tracking-tight text-left">{currentCard.reading} {currentCard.secondaryreading}</p>
                                                                </div>
                                                                <span className="bg-emerald-500 text-white px-2.5 py-1 rounded-full font-black text-[10px] uppercase shadow-sm">{ttsStatus}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center p-10 text-slate-300 font-bold space-y-4 text-center"><Icon name="search-x" size={64} /><p className="text-lg">尚未選擇 Lab 單元</p><button onClick={() => { vibrate(10); setView('settings'); }} className="bg-slate-200 text-slate-500 px-10 py-4 rounded-full text-sm font-black uppercase">前往設定</button></div>
                                    )}
                                </div>

                                <div className="shrink-0 p-4 pb-[calc(var(--safe-bottom)+1.5rem)]">
                                    <div className="grid grid-cols-2 gap-5 max-w-sm mx-auto">
                                        <button onClick={() => { if(currentIndex>0) { setIsFlipped(false); setCurrentIndex(p=>p-1); } }} disabled={currentIndex === 0} className="bg-white dark-mode-card dark-mode-text dark-mode-border border-2 py-5 rounded-[2rem] font-black text-slate-400 disabled:opacity-30 active:scale-95 transition-all shadow-sm text-sm uppercase tracking-widest">PREV</button>
                                        <button onClick={() => { if(currentIndex < cards.length-1) { setIsFlipped(false); setCurrentIndex(p=>p+1); } else generatePracticeSet(); }} className={`bg-${themePrimary}-600 text-white py-5 rounded-[2rem] font-black shadow-lg active:scale-95 transition-all text-sm uppercase tracking-widest`}>NEXT</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="h-full flex flex-col overflow-hidden text-left">
                                <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 animate-in slide-in-from-bottom-4 duration-500 pb-40 text-left">
                                    <section className="bg-white dark-mode-card p-5 rounded-[2.5rem] shadow-lg space-y-4 text-left">
                                        <div className="flex justify-between items-center text-left"><h2 className="text-sm md:text-base font-black text-slate-700 dark-mode-text uppercase tracking-widest flex items-center gap-2"><Icon name="beaker" size={18} className="text-indigo-600" /> Lab 範圍</h2><button className="bg-indigo-50 dark-mode-secondary text-indigo-500 px-3 py-1.5 rounded-full text-[10px] font-black uppercase">v8.2</button></div>
                                        <div className="space-y-1.5 text-left"><label className="text-xs font-black text-slate-400 dark-mode-text uppercase ml-1">選擇 Lab 課程</label><select value={activeCourseId} onChange={(e) => { vibrate(10); setActiveCourseId(e.target.value); setSelectedUnits([]); }} className="w-full p-3.5 bg-slate-50 dark-mode-secondary dark-mode-text rounded-xl text-sm font-bold border-none outline-none ring-1 ring-slate-100 focus:ring-indigo-500"><option value="builtin">💡 實驗室手冊</option>{Object.keys(cloudCourses).map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                                        <div className="space-y-2 text-left"><label className="text-xs font-black text-slate-400 dark-mode-text uppercase ml-1">選擇單元 ({selectedUnits.length}/{availableUnits.length})</label><div className="grid grid-cols-2 gap-2.5">{availableUnits.map(u => (<button key={u} onClick={() => { vibrate(5); setSelectedUnits(prev => prev.includes(u) ? prev.filter(x => x !== u) : [...prev, u]); }} className={`py-3 px-2 rounded-xl text-xs font-black border transition-all ${selectedUnits.includes(u) ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark-mode-card dark-mode-text dark-mode-border border-slate-100'}`}>{u}</button>))}</div></div>
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left">
                                        <button onClick={() => toggleSection('pref')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left"><div className="text-left"><h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2"><Icon name="sliders" size={18} className="text-amber-500" /> 偏好設定</h3><p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tight">{speechRate}x / {isLargeFont?'大字':'標字'} / 節奏:{autoPlayTempo}s</p></div><Icon name={openSections.pref ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" /></button>
                                        {openSections.pref && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left">
                                                <div className="pt-2 space-y-6 text-left">
                                                    <div className="space-y-2"><div className="flex justify-between items-center"><span className="text-xs font-black text-slate-500 dark-mode-text uppercase">發音速度: {speechRate}x</span></div><input type="range" min="0.5" max="1.5" step="0.1" value={speechRate} onChange={(e) => setSpeechRate(parseFloat(e.target.value))} className="w-full accent-indigo-600 h-1.5 bg-slate-100 dark-mode-secondary rounded-lg appearance-none cursor-pointer" /></div>
                                                    <div className="space-y-2 border-t border-slate-100 pt-4"><div className="flex justify-between items-center"><span className="text-xs font-black text-slate-500 dark-mode-text uppercase">自動巡迴節奏: {autoPlayTempo}s</span></div><input type="range" min="3" max="12" step="0.5" value={autoPlayTempo} onChange={(e) => setAutoPlayTempo(parseFloat(e.target.value))} className="w-full accent-rose-500 h-1.5 bg-slate-100 dark-mode-secondary rounded-lg appearance-none cursor-pointer" /><p className="text-[9px] text-slate-400 font-bold uppercase mt-1">決定正背面切換的速度</p></div>
                                                    <div className="border-t border-slate-100 dark-mode-border pt-4 space-y-4">
                                                        <label className="flex items-center justify-between cursor-pointer p-4 bg-indigo-50/50 dark-mode-secondary rounded-xl border border-indigo-100/50 transition-all active:scale-[0.98]"><div className="flex flex-col"><span className="text-sm font-bold text-indigo-700 dark-mode-text font-black">大字版面模式</span><span className="text-[10px] text-indigo-400 uppercase font-black font-mono tracking-tighter">DYNAMIC FONT SCALING</span></div><input type="checkbox" checked={isLargeFont} onChange={(e) => { vibrate(20); setIsLargeFont(e.target.checked); }} className="w-6 h-6 rounded-md accent-indigo-600" /></label>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left">
                                        <button onClick={() => toggleSection('sync')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left"><div className="text-left"><h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2"><Icon name="refresh-cw" size={18} className="text-emerald-500" /> Lab 連線</h3><p className="text-[10px] text-slate-400 font-bold mt-1 tracking-tight">{gasUrl ? 'CONNECTED' : 'SETUP REQUIRED'}</p></div><Icon name={openSections.sync ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" /></button>
                                        {openSections.sync && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left">
                                                <div className="pt-2 space-y-4 text-left">
                                                    <input type="text" placeholder="貼上 Dev GAS URL" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} className="w-full p-4 bg-slate-50 dark-mode-secondary dark-mode-text rounded-xl text-xs font-mono border-none outline-none ring-1 ring-slate-100 focus:ring-indigo-500" />
                                                    <button onClick={syncFromCloud} disabled={!gasUrl || isSyncing} className={`w-full py-4 rounded-xl bg-slate-800 text-white font-black text-sm active:scale-95 transition-all shadow-lg ${isSyncing ? 'opacity-50' : ''}`}>從 Lab 環境同步課程</button>
                                                    <div className="pt-2 border-t border-slate-100 dark-mode-border"><button onClick={factoryReset} className="text-rose-400 text-xs font-black uppercase flex items-center gap-1 hover:text-rose-600 transition-colors py-2"><Icon name="trash-2" size={14} /> 重設測試資料 (Factory Reset)</button></div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <section className="bg-white dark-mode-card rounded-[1.5rem] shadow-md overflow-hidden border border-slate-50 transition-all text-left last-node">
                                        <button onClick={() => toggleSection('voice')} className="w-full p-5 flex justify-between items-center active:bg-slate-50 transition-colors text-left"><div className="text-left"><h3 className="text-sm md:text-base font-black text-slate-700 dark-mode-text flex items-center gap-2"><Icon name="database" size={18} className="text-rose-500" /> 語音資源</h3><p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tight">{storageStats.count} FILES / {storageStats.size} MB</p></div><Icon name={openSections.voice ? "chevron-up" : "chevron-down"} size={20} className="text-slate-300" /></button>
                                        {openSections.voice && (
                                            <div className="px-5 pb-6 space-y-5 animate-in slide-in-from-top-2 text-left">
                                                <div className="pt-2 bg-indigo-50/50 dark-mode-secondary p-5 rounded-2xl space-y-4 text-left">
                                                    {downloadProgress !== null ? (
                                                        <div className="space-y-2 text-left"><div className="flex justify-between text-xs font-black text-indigo-400 uppercase tracking-widest text-left"><span>Downloading...</span><span>{downloadProgress}%</span></div><div className="w-full bg-white h-2 rounded-full overflow-hidden mt-1 shadow-inner"><div className="bg-indigo-600 h-full transition-all" style={{ width: `${downloadProgress}%` }}></div></div></div>
                                                    ) : (
                                                        <div className="flex gap-3 text-left"><button onClick={downloadAll} className="flex-1 bg-indigo-600 text-white text-xs py-3.5 rounded-xl font-black shadow-sm active:scale-95 transition-all uppercase tracking-tighter text-left">下載 MP3 離線包</button><button onClick={clearCache} className="bg-white border border-rose-200 text-rose-500 text-xs py-3.5 px-4 rounded-xl font-black active:scale-95 transition-all text-left">清除</button></div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </section>
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 p-4 pb-[calc(var(--safe-bottom)+0.5rem)] bg-gradient-to-t from-slate-50 dark-mode-bg to-transparent z-20 text-left">
                                    <div className="text-left">
                                        <button onClick={() => generatePracticeSet()} className="bg-slate-900 text-white w-full py-5 rounded-full font-black shadow-2xl flex items-center justify-center gap-3 active:scale-95 transition-all border-2 border-white/20 text-left"><Icon name="check-circle" size={20} /><span className="text-sm md:text-base font-black uppercase tracking-widest text-left">儲存設定並返回</span></button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
